<div class="layout">
 <nav class="rail" aria-label="Главное меню">
  <a class="rail-logo" href="#" data-page="home" aria-label="Tenmayurika — обзор"><span>天</span></a>
  <div class="rail-group">
   <button type="button" data-page="home" class="active" data-tip="Обзор" aria-label="Обзор"><svg class="icon"><use href="#i-home"/></svg></button>
   <button type="button" data-page="planner" data-tip="Планер: дела, календарь, заметки" aria-label="Планер"><svg class="icon"><use href="#i-calendar"/></svg><span class="rail-badge" data-badge="planner" hidden></span></button>
   <button type="button" data-page="brain" data-tip="Мозг: живая карта памяти" aria-label="Мозг"><svg class="icon"><use href="#i-brain"/></svg></button>
   <button type="button" data-page="facts" data-tip="Факты памяти" aria-label="Факты памяти"><svg class="icon"><use href="#i-facts"/></svg></button>
   <button type="button" data-page="library" data-tip="Личная библиотека" aria-label="Личная библиотека"><svg class="icon"><use href="#i-cloud"/></svg></button>
  </div>
  <div class="rail-group rail-bottom">
   <button type="button" id="avatar-toggle" data-tip="Аватар" aria-label="Показать или скрыть аватар"><svg class="icon"><use href="#i-fox"/></svg></button>
   <button type="button" data-page="settings" data-tip="Настройки проекта" aria-label="Настройки проекта"><svg class="icon"><use href="#i-settings"/></svg></button>
  </div>
 </nav>
 <main>
  <header class="topbar">

   <span id="status" class="status">Подключение...</span>
  </header>
  <section id="content" aria-live="polite"></section>
