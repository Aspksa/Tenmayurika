name: Windows launcher checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check server.js
          node --check storage.js
          node --check tools/launcher.js
          node --check sync-worker.js
          node --check tools/verify-backup.js
          node --check tools/backup-complete.js
          node --check tools/maintenance.js
          node --check tools/progress.js
          node --check tools/run-npm.js
          node tools/run-npm.js --version
          node tools/progress.js 3
          node --check memory-core.js
          node --check vector-store.js
          node --check tools/verify-complete.js
      - name: Validate PowerShell download scripts
        shell: pwsh
        run: |
          foreach ($file in @('tools/download-monitor.ps1','tools/bootstrap-node.ps1','tools/bootstrap-python.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file : $errors" }
          }
          $rejected=$false
          try { & ./tools/download-monitor.ps1 -Url 'http://example.com/file' -Destination (Join-Path $env:RUNNER_TEMP 'invalid.zip') } catch { $rejected=$true }
          if (-not $rejected) { throw 'Expected insecure URL rejection' }
          $rejected=$false
          try { & ./tools/download-monitor.ps1 -Url 'https://example.com/file' -Destination (Join-Path $env:RUNNER_TEMP 'invalid.zip') -ExpectedSha256 'bad' } catch { $rejected=$true }
          if (-not $rejected) { throw 'Expected invalid SHA256 rejection' }
          $rejected=$false
          try { & ./tools/download-monitor.ps1 -Url 'https://example.com/file' -Destination (Join-Path $env:RUNNER_TEMP 'invalid.zip') -MaxAttempts 0 } catch { $rejected=$true }
          if (-not $rejected) { throw 'Expected invalid retry count rejection' }
      - name: Verify memory core startup
        shell: pwsh
        run: |
          node memory-core.js diagnostics
          node memory-core.js facts
      - name: Run tests
        run: npm test
      - name: Test Windows BAT doctor in Cyrillic path
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Тест (путь) & проверка'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path '.\*' -Destination $target -Recurse -Force
          Push-Location $target
          try {
            & cmd.exe /d /c 'call Tenmayurika.bat doctor'
            if ($LASTEXITCODE -ne 0) { throw "BAT doctor failed: $LASTEXITCODE" }
          } finally { Pop-Location }
      - name: Test Windows BAT dependency install in Cyrillic path with spaces
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Рабочий стол\Tenmayurika (копия) & тест'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Get-ChildItem -Force -Path . | Where-Object { $_.Name -notin @('node_modules','.git') } | Copy-Item -Destination $target -Recurse -Force
          if (Test-Path (Join-Path $target 'node_modules')) { throw 'node_modules must be absent before the BAT run' }
          Push-Location $target
          try {
            & cmd.exe /d /c 'call Tenmayurika.bat doctor < nul'
            if ($LASTEXITCODE -ne 0) { throw "BAT dependency install failed: $LASTEXITCODE" }
            if (-not (Test-Path (Join-Path $target 'node_modules\@lancedb\lancedb'))) { throw 'Dependencies were not installed by BAT' }
          } finally { Pop-Location }
