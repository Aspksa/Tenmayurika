name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test

  prepare-pdf-lock:
    name: Prepare PDF dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve PDF package
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund pdfjs-dist@5.6.205
          node -e "const z=require('node:zlib'),f=require('node:fs'); console.log('TENMA_LOCK_BEGIN'+z.gzipSync(f.readFileSync('package-lock.json')).toString('base64')+'TENMA_LOCK_END')"
